<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0d0d0d" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- bg -->
  <rect width="1500" height="500" fill="#000000"/>
  <rect width="1500" height="500" fill="url(#grid)"/>

  <!-- corner brackets -->
  <path d="M 40 40 L 40 100 M 40 40 L 100 40" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M 1460 460 L 1460 400 M 1460 460 L 1400 460" stroke="#ffffff" stroke-width="3" fill="none"/>

  <!-- ris3 wordmark — centered, single text with tspan -->
  <text x="750" y="285"
        font-family="'DejaVu Sans Mono', 'JetBrains Mono', 'Menlo', monospace"
        font-weight="bold"
        font-size="220"
        letter-spacing="-4"
        text-anchor="middle"
        fill="#ffffff">ris<tspan fill="#00ff85">3</tspan></text>

  <!-- tagline -->
  <text x="750" y="360"
        font-family="'DejaVu Sans Mono', 'JetBrains Mono', monospace"
        font-weight="bold"
        font-size="28"
        letter-spacing="8"
        text-anchor="middle"
        fill="#ffffff">LONG · LEVERED · ONCHAIN</text>

  <!-- footer line + url -->
  <line x1="200" y1="410" x2="1300" y2="410" stroke="#2a2a2a" stroke-width="1"/>
  <text x="750" y="445"
        font-family="'DejaVu Sans Mono', monospace"
        font-size="16"
        letter-spacing="6"
        text-anchor="middle"
        fill="#ffffff">UNISWAP V4 · MAINNET · ris3.xyz</text>
</svg>
