<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- black bg -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- corner brackets -->
  <path d="M 24 24 L 24 60 M 24 24 L 60 24" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M 488 488 L 488 452 M 488 488 L 452 488" stroke="#ffffff" stroke-width="3" fill="none"/>

  <!-- ris3 wordmark — single text element with tspan, no double-anchoring -->
  <text x="256" y="290"
        font-family="'DejaVu Sans Mono', 'JetBrains Mono', 'Menlo', monospace"
        font-weight="bold"
        font-size="170"
        letter-spacing="-2"
        text-anchor="middle"
        fill="#ffffff">ris<tspan fill="#00ff85">3</tspan></text>

  <!-- tagline -->
  <text x="256" y="350"
        font-family="'DejaVu Sans Mono', 'JetBrains Mono', monospace"
        font-weight="bold"
        font-size="22"
        letter-spacing="6"
        text-anchor="middle"
        fill="#888888">LONG · LEVERED</text>

  <line x1="80" y1="380" x2="432" y2="380" stroke="#1a1a1a" stroke-width="1"/>

  <text x="256" y="410"
        font-family="'DejaVu Sans Mono', monospace"
        font-size="14"
        letter-spacing="4"
        text-anchor="middle"
        fill="#555555">UNISWAP V4</text>
</svg>
